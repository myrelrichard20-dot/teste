<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Um convite 💕</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffe6f0;
            font-family: Arial, sans-serif;
        }

        .caixa {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            color: #e91e63;
        }

        button {
            border: none;
            padding: 12px 25px;
            margin: 10px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        #sim {
            background: #4caf50;
            color: white;
        }

        #nao {
            background: #f44336;
            color: white;
        }

        #resultado {
            font-size: 50px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="caixa">
        <h1>Você quer sair comigo sexta-feira? 💕</h1>

        <button id="sim" onclick="responderSim()">Sim ❤️</button>
        <button id="nao" onclick="responderNao()">Não</button>

        <div id="resultado"></div>
    </div>

    <script>
        function responderSim() {
            document.getElementById("resultado").innerHTML = "😊💕";
        }

        function responderNao() {
            alert("Não é possível completar a ação 😅");
        }
    </script>

</body>
</html>
