<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite especial para Pedro Seixas</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffe6f0;
            font-family: Arial, sans-serif;
        }

        .caixa {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            color: #e91e63;
        }
.foto-pedro {
    width: 300px;
    max-width: 100%;
    border-radius: 15px;
    margin-top: 10px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.2);
}
        button {
            border: none;
            padding: 12px 25px;
            margin: 10px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        #sim {
            background: #4caf50;
            color: white;
        }

        #nao {
            background: #f44336;
            color: white;
        }

        #resultado {
            font-size: 50px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="caixa">
        <h1>Você se enxerga como uma pessoa bonita?</h1>

        <button id="sim" onclick="responderSim()">Sim ❤️</button>
        <button id="nao" onclick="responderNao()">Não</button>

        <div id="resultado"></div>
    </div>

    <script>
        function responderSim() {
            document.getElementById("resultado").innerHTML = <div>
                Realmente, olha só que homem perfeito, sem condições.
                <br><br>
                <img src="pedro.jpeg" alt="Homem perfeito" class="foto-pedro">
            </div>;
        }

        function responderNao() {
            alert("Não é possível que você ache isso, pode ir desacreditanto porque sua beleza é tamanha que não cabe explicação nem com todas as palavras do mundo.");
        }
    </script>

</body>
</html>
